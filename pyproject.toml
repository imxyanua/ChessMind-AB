[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chessmind-ab"
version = "0.1.0"
description = "Chess simulation with Minimax and Alpha-Beta Pruning"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ChessMind-AB" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "Pillow>=10.0"]

[project.scripts]
chessmind-ab = "chessmind_ab.presentation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chessmind_ab = ["assets/pieces/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
